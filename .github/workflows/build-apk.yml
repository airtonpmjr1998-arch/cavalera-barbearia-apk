name: Gerar APK Cavalera

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ""

      - name: Aceitar licenças Android
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Instalar Android SDK necessário
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Verificar URL do aplicativo
        shell: bash
        env:
          WEB_APP_URL: ${{ vars.WEB_APP_URL }}
        run: |
          if [ -z "$WEB_APP_URL" ]; then
            echo "ERRO: WEB_APP_URL não foi configurada."
            exit 1
          fi

          if [[ "$WEB_APP_URL" != https://* ]]; then
            echo "ERRO: WEB_APP_URL precisa começar com https://"
            exit 1
          fi

          echo "URL configurada corretamente."

      - name: Gerar APK Cavalera
        shell: bash
        env:
          WEB_APP_URL: ${{ vars.WEB_APP_URL }}
        run: |
          gradle --no-daemon \
            :app:assembleDebug \
            -PWEB_APP_URL="$WEB_APP_URL"

      - name: Preparar APK
        shell: bash
        run: |
          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            Cavalera-Barbearia.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v7
        with:
          name: Cavalera-Barbearia-APK
          path: Cavalera-Barbearia.apk
          if-no-files-found: error
          retention-days: 7
